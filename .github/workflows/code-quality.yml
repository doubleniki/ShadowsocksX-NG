name: Code Quality

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SwiftLint
        run: |
          brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint lint --reporter github-actions-logging

      - name: SwiftLint (strict mode for critical rules)
        run: |
          # ????????? ????????? ??????? ? ??????? ??????
          swiftlint lint --strict --config .swiftlint-strict.yml || true
        continue-on-error: true

  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod --version

      - name: Install dependencies
        run: |
          pod install

      - name: Build project
        run: |
          xcodebuild clean build \
            -workspace ShadowsocksX-NG.xcworkspace \
            -scheme ShadowsocksX-NG \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run tests
        run: |
          xcodebuild test \
            -workspace ShadowsocksX-NG.xcworkspace \
            -scheme ShadowsocksX-NG \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
        continue-on-error: true  # ???? ?????? ???

      - name: Check for compiler warnings
        run: |
          # ????????? ?????????? ?????????????? ???????????
          xcodebuild clean build \
            -workspace ShadowsocksX-NG.xcworkspace \
            -scheme ShadowsocksX-NG \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          
          # ???????????? ??????????????
          WARNING_COUNT=$(grep -c "warning:" build.log || true)
          echo "Found $WARNING_COUNT compiler warnings"
          
          # ???? ?????? ???????????, ?? ??????
          if [ $WARNING_COUNT -gt 50 ]; then
            echo "::warning::Too many warnings: $WARNING_COUNT"
          fi
