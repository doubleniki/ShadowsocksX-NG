name: Code Quality

on:
  push:
    branches: [develop, main]
    # SwiftLint всегда запускается, но build/test пропускаются для документации
  pull_request:
    branches: [develop]

jobs:
  # Проверка, нужно ли запускать билд и тесты
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check changed files
        id: check
        run: |
          # Для push событий
          if [ "${{ github.event_name }}" == "push" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          else
            # Для pull request
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Проверяем, есть ли изменения не в документации
          if echo "$CHANGED_FILES" | grep -qvE '\.(md|txt)$|^docs/|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)/|^(LICENSE|\.gitignore|\.gitattributes|CLAUDE\.md)$'; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✓ Build required (code changes detected)"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "✗ Build skipped (only documentation changes)"
          fi

  swiftlint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint lint --reporter github-actions-logging

      - name: SwiftLint (strict mode for critical rules)
        run: |
          # Check critical rules in strict mode
          swiftlint lint --strict --config .swiftlint-strict.yml
        continue-on-error: true

  build-and-test:
    name: Build and Test
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod --version

      - name: Install dependencies
        run: |
          pod install

      - name: Restore dependencies cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/dist
            ShadowsocksX-NG/ss-local
            ShadowsocksX-NG/privoxy
            ShadowsocksX-NG/simple-obfs
            ShadowsocksX-NG/v2ray-plugin
            ShadowsocksX-NG/kcptun
          key: deps-${{ runner.os }}-${{ hashFiles('deps/**', '!deps/dist') }}

      - name: Build native dependencies if not cached
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          brew install automake autoconf libtool pcre
          echo "Building native dependencies..."
          make -C deps all || echo "Native deps build failed, will use placeholders"
        env:
          MAKEFLAGS: "-j$(sysctl -n hw.ncpu)"

      - name: Create placeholder binaries if needed
        run: |
          # Create empty placeholder files for binaries that don't exist
          # This allows the project to compile for testing even without native deps
          [ ! -f ShadowsocksX-NG/ss-local/ss-local ] && touch ShadowsocksX-NG/ss-local/ss-local
          [ ! -f ShadowsocksX-NG/privoxy/privoxy ] && touch ShadowsocksX-NG/privoxy/privoxy
          [ ! -f ShadowsocksX-NG/simple-obfs/obfs-local ] && touch ShadowsocksX-NG/simple-obfs/obfs-local
          [ ! -f ShadowsocksX-NG/v2ray-plugin/v2ray-plugin ] && touch ShadowsocksX-NG/v2ray-plugin/v2ray-plugin
          [ ! -f ShadowsocksX-NG/kcptun/client ] && touch ShadowsocksX-NG/kcptun/client
          chmod +x ShadowsocksX-NG/ss-local/ss-local
          chmod +x ShadowsocksX-NG/privoxy/privoxy
          chmod +x ShadowsocksX-NG/simple-obfs/obfs-local
          chmod +x ShadowsocksX-NG/v2ray-plugin/v2ray-plugin
          chmod +x ShadowsocksX-NG/kcptun/client
          echo "Placeholder binaries created (if needed)"

      - name: Build project
        run: |
          xcodebuild clean build \
            -workspace ShadowsocksX-NG.xcworkspace \
            -scheme ShadowsocksX-NG \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: |
          xcodebuild test \
            -workspace ShadowsocksX-NG.xcworkspace \
            -scheme ShadowsocksX-NG \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Check for compiler warnings
        run: |
          # Check compiler warnings count
          set -o pipefail
          xcodebuild clean build \
            -workspace ShadowsocksX-NG.xcworkspace \
            -scheme ShadowsocksX-NG \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

          # Count warnings
          WARNING_COUNT=$(grep -c "warning:" build.log || true)
          echo "Found $WARNING_COUNT compiler warnings"

          # Only inform, don't fail
          if [ "$WARNING_COUNT" -gt 50 ]; then
            echo "::warning::Too many warnings: $WARNING_COUNT"
          fi
        continue-on-error: true
