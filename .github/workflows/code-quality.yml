name: Code Quality

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint lint --reporter github-actions-logging

      - name: SwiftLint (strict mode for critical rules)
        run: |
          # Check critical rules in strict mode
          swiftlint lint --strict --config .swiftlint-strict.yml
        continue-on-error: true

  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod --version

      - name: Install dependencies
        run: |
          pod install

      - name: Build project
        run: |
          xcodebuild clean build \
            -workspace ShadowsocksX-NG.xcworkspace \
            -scheme ShadowsocksX-NG \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: |
          xcodebuild test \
            -workspace ShadowsocksX-NG.xcworkspace \
            -scheme ShadowsocksX-NG \
            -configuration Debug \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Check for compiler warnings
        run: |
          # Check compiler warnings count
          set -o pipefail
          xcodebuild clean build \
            -workspace ShadowsocksX-NG.xcworkspace \
            -scheme ShadowsocksX-NG \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

          # Count warnings
          WARNING_COUNT=$(grep -c "warning:" build.log || true)
          echo "Found $WARNING_COUNT compiler warnings"

          # Only inform, don't fail
          if [ "$WARNING_COUNT" -gt 50 ]; then
            echo "::warning::Too many warnings: $WARNING_COUNT"
          fi
        continue-on-error: true
