# SwiftLint Configuration
# ShadowsocksX-NG Code Quality Standards

# Disabled rules
disabled_rules:
  - trailing_whitespace
  - todo

# Opt-in rules
opt_in_rules:
  - empty_count
  - explicit_init
  - force_unwrapping
  - force_try
  - closure_spacing
  - contains_over_first_not_nil
  - empty_string
  - fatal_error_message
  - first_where
  - joined_default_parameter
  - let_var_whitespace
  - multiline_parameters
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_first_last

# Excluded paths
excluded:
  - Carthage
  - Pods
  - deps
  - build
  - DerivedData
  - .build
  - LaunchHelper

# Line length
line_length:
  warning: 120
  error: 150
  ignores_function_declarations: false
  ignores_comments: false
  ignores_urls: true

# Function body length
function_body_length:
  warning: 60
  error: 100

# File length
file_length:
  warning: 400
  error: 1000
  ignore_comment_only_lines: true

# Type body length
type_body_length:
  warning: 300
  error: 500

# Identifier name
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - i
    - j
    - x
    - y
    - z
  allowed_symbols: ["_"]

# Type name
type_name:
  min_length:
    warning: 3
    error: 0
  max_length:
    warning: 40
    error: 50
  excluded:
    - ID
    - URL
    - Key

# Function parameter count
function_parameter_count:
  warning: 5
  error: 8

# Nesting
nesting:
  type_level:
    warning: 2

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 10
  error: 20
  ignores_case_statements: false

# Vertical whitespace
vertical_whitespace:
  max_empty_lines: 2

# Force unwrapping severity
force_unwrapping:
  severity: error

# Force try severity
force_try:
  severity: error

# Custom rules
custom_rules:
  # No NSLog - use os.log instead
  no_nslog:
    name: "No NSLog"
    regex: "NSLog\\("
    message: "Use os.log instead of NSLog"
    severity: warning

  # No print in production code
  no_print:
    name: "No Print"
    regex: "\\bprint\\("
    match_kinds:
      - identifier
    message: "Use Logger instead of print()"
    severity: warning

# Reporter format
reporter: "xcode"
