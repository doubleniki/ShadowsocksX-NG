# SwiftLint Configuration
# ShadowsocksX-NG Code Quality Standards

# ??????????? ???????
disabled_rules:
  - trailing_whitespace  # ????? ?????????????? ????????
  - todo                 # TODO ??????????? ? issues

# ?????????? ???????????? ???????
opt_in_rules:
  - empty_count           # ?????????? .isEmpty ?????? .count == 0
  - explicit_init         # ????? ?????????????
  - force_unwrapping      # ????? ??? ! ?????????????
  - force_try             # ????? ??? try! ?????????????
  - closure_spacing       # ??????? ? ??????????
  - contains_over_first_not_nil  # .contains ?????? .first != nil
  - empty_string          # "" ?????? String()
  - fatal_error_message   # fatalError ?????? ????? ?????????
  - first_where           # .first(where:) ?????? .filter().first
  - joined_default_parameter  # ????? ???????? ??? joined()
  - let_var_whitespace    # ??????? ????? ????????????
  - multiline_parameters  # ?????????????? ????????????? ??????????
  - operator_usage_whitespace  # ??????? ?????? ??????????
  - redundant_nil_coalescing  # ?????????? ?? nil
  - sorted_first_last     # .sorted().first ?????? .min()

# ??????????? ????
excluded:
  - Carthage
  - Pods
  - deps
  - build
  - DerivedData
  - .build
  - LaunchHelper  # ????????? ??????

# ????? ??????
line_length:
  warning: 120
  error: 150
  ignores_function_declarations: false
  ignores_comments: false
  ignores_urls: true

# ????? ???????
function_body_length:
  warning: 40
  error: 100

# ????? ?????
file_length:
  warning: 400
  error: 1000
  ignore_comment_only_lines: true

# ????? ???? ????
type_body_length:
  warning: 300
  error: 500

# ????? ???????????????
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - i
    - j
    - x
    - y
    - z
  allowed_symbols: ["_"]

# ????? ?????
type_name:
  min_length:
    warning: 3
    error: 0
  max_length:
    warning: 40
    error: 50
  excluded:
    - ID
    - URL
    - Key

# ?????????? ?????????? ???????
function_parameter_count:
  warning: 5
  error: 8

# ???????????
nesting:
  type_level:
    warning: 2
  statement_level:
    warning: 5

# ??????????????? ?????????
cyclomatic_complexity:
  warning: 10
  error: 20
  ignores_case_statements: false

# ?????????? ????? ? closure
closure_body_length:
  warning: 20
  error: 40

# ?????? ??????
vertical_whitespace:
  max_empty_lines: 2

# ???????
indentation: 4

# ?????????????? ????????? ??? force unwrapping
force_unwrapping:
  severity: error  # ?????? ??? ???????, ????? ???????? ????????

# ?????????????? ????????? ??? force try
force_try:
  severity: error  # ?????? ??? ???????

# ?????????????? ????????? ??? ?????? catch ??????
empty_catch:
  severity: warning

# ???????????????? ???????
custom_rules:
  # ?????? NSLog ? ?????? os.log
  no_nslog:
    name: "No NSLog"
    regex: "NSLog\\("
    message: "??????????? os.log ?????? NSLog"
    severity: warning

  # ?????????????? ? print ? production ????
  no_print:
    name: "No Print"
    regex: "\\bprint\\("
    match_kinds:
      - identifier
    message: "??????????? Logger ?????? print()"
    severity: warning

  # ?????? ?? ????????????? magic numbers
  # (????? 0, 1, 2 ? ? test ??????)
  no_magic_numbers:
    name: "No Magic Numbers"
    regex: "(?<![\\d\\.])((?!0|1|2)[3-9]|[1-9]\\d+)(?![\\d\\.])"
    excluded: ".*Tests?\\.swift$"
    message: "??????????? ??????????? ????????? ?????? magic numbers"
    severity: warning

# ????????? ?????????
reporter: "xcode"  # ?????? ?????? ??? Xcode
